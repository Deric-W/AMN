[project]
name = "AMN"
description = "Virtual machines for the AMN instructions sets"
requires-python = ">=3.10"
keywords = [
    "AM0",
    "AM1",
    "AMN"
]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Education",
    "Topic :: Utilities",
    "Typing :: Typed"
]
dynamic = ["version"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[[project.authors]]
name = "Eric Niklas Wolf"
email = "eric_niklas.wolf@mailbox.tu-dresden.de"

[project.urls]
Repository = "https://github.com/Deric-W/AMN"
Bugtracker = "https://github.com/Deric-W/AMN/issues"

[project.scripts]
amn = "AMN.main:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "src/AMN/_version.py"

[tool.hatch.envs.default]
installer = "pip"

[tool.hatch.envs.hatch-test]
installer = "pip"

[[tool.hatch.envs.hatch-test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

[tool.hatch.envs.hatch-check-fmt]
installer = "pip"
config-path = ".ruff_defaults.toml"

[tool.hatch.envs.hatch-check-code]
installer = "pip"
config-path = ".ruff_defaults.toml"

[tool.hatch.envs.hatch-check-types]
installer = "pip"
# do not override inherited test dependencies
extra-dependencies = [
    "mypy ~= 2.4"
]

[tool.hatch.envs.hatch-check-types.scripts]
check = "mypy -p AMN --cache-dir \"{root}/.mypy_cache\" --pretty {args}"
check-summarize = "mypy -p AMN --cache-dir \"{root}/.mypy_cache\" {args}"
coverage = "mypy -p AMN --cache-dir \"{root}/.mypy_cache\" --linecoverage-report \"{root}/.mypy_reports\" {args}"

[tool.hatch.build.targets.sdist]
exclude = ["/.github"]

[tool.mypy]
disallow_any_unimported = true
disallow_any_generics = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[tool.ruff]
extend = ".ruff_defaults.toml"
line-length = 100

[tool.ruff.lint]
ignore = [
    "TID252"    # relative imports
]

[tool.ruff.lint.extend-per-file-ignores]
"src/AMN/*" = [
    "N999"      # invalid module name
]
"tests/*" = [
    "PT009",    # unittest-style assert
    "PT027"     # unittest-style assertRaises
]

[tool.coverage.run]
source_pkgs = ["AMN"]
branch = true
parallel = true